spring.application.name=weather-forecast-service

spring.mvc.problemdetails.enabled=true

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,prometheus

metno.base-url=https://api.met.no
metno.user-agent=weather-forecast-service github.com/Sureac/weather-forecast-service
metno.connect-timeout=2s
metno.read-timeout=5s
